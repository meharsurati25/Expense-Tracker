<html>
    <head>
        <title>Expense Tracker</title>
        <link rel="stylesheet" href="Expense Tracker\style.css">
    </head>
    <body>
        <div class="container">
            <div class="title">
                <h1>Expense Tracker</h1>
            </div>

            <div class="balance_container">
                <span id="balance"></span>
            </div>

            <div class="transaction">
                <button id="add_transaction">Add Transcation</button>
                <input type="text" id="expense_input" placeholder="Enter transaction">
            </div>

            <div class="filters">
                <button id="all">All</button>
                <button id="credit">Credit</button>
                <button id="debit">Debit</button>
            </div>

            <ul id="expense_list">
            </ul>


        </div>
    </body>
</html>
