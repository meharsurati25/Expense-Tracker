<html>
    <head>
        <title>Expense Tracker</title>
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/general.css">
        <link rel="stylesheet" href="css/filters.css">
        <link rel="stylesheet" href="css/transation_input.css">
        <link rel="stylesheet" href="css/transation_input.css">
        <link rel="stylesheet" href="css/list.css">
    </head>
    <body>
        <!-- container -->
        <div class="container">
            <div class="title">
                <h1>Expense Tracker</h1>
                <p class="subtitle">Track your income and expenses easily</p>
            </div>

            <div class="balance_container">
                <span id="balance">Balance :</span>
            </div>

            <!-- transaction input -->
            <div class="transaction">
                <div class="transaction_btn">
                    <button id="add_transaction">Add Transcation</button>
                </div>
                <div id = "transaction_feature" class="hidden">
                    <div class="input_container">
                        <input type="text" placeholder="Enter Transcation" id="transaction_input">
                        <button id="cross">x</button>
                    </div>
                    <div class="category_credit">
                        <select id="category_input">
                        <option value="" disabled selected>Select Category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Other">Other</option>
                    </select>
                        <button id = "credit_trans">Credit</button>
                        <button id = "debit_trans">Debit</button>
                    </div>
                    
    
                    
                </div>
            </div>

            <!-- filters -->
            <div class="filters">
                <button id="all" class="filter-btn filter-btn-active">All</button>
                <button id="credit" class="filter-btn">Credit</button>
                <button id="debit" class="filter-btn">Debit</button>
            </div>
            
            <!-- list -->
            <ul id="expense_list">
            </ul>

        </div>

        <script src="script.js"></script>
    </body>
</html>
